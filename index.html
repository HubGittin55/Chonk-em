<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHONK 'EM — v0.4</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="mute" title="toggle sound">🔊</button>
  <div id="overlay" class="hidden">
    <h2 id="overlay-title"></h2>
    <p id="overlay-sub"></p>
    <button id="retry">Retry</button>
    <button id="next" class="hidden">Next Level →</button>
  </div>
  <div id="errtoast" class="hidden"></div>
  <div id="results" class="hidden">
    <h2 id="res-title">&#9878; WEIGH-IN! &#9878;</h2>
    <canvas id="scaleCanvas" width="320" height="250"></canvas>
    <div id="res-stars"><span id="rs0">&#9734;</span><span id="rs1">&#9734;</span><span id="rs2">&#9734;</span></div>
    <p id="res-sub"></p>
    <div class="row">
      <button id="res-retry">Retry</button>
      <button id="res-menu">Menu</button>
      <button id="res-next">Next &rarr;</button>
    </div>
  </div>
  <div id="menuOverlay">
    <h1>CHONK &rsquo;EM</h1>
    <p class="sub">pick a level &middot; fatten the cat</p>
    <div id="diffRow"></div>
    <div id="catRow"></div>
    <div id="levelGrid"></div>
    <button id="resetGame">&#128465; reset everything</button>
  </div>
  <button id="menuBtn" title="level select">&#9776;</button>
  <div id="levelSplash" class="hidden">
    <h2 id="splashTitle"></h2>
    <p id="splashSub"></p>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/levels.js"></script>
<script src="js/barrels.js"></script>
<script src="js/conveyor.js"></script>
<script src="js/vacuum.js"></script>
<script src="js/cats.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
<!-- pages rebuild nudge -->
</body>
</html>
